<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense claims</title>
  <!-- Relative paths only: the app is served under /myapp/ behind a proxy. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div>
      <h1>Expense claims</h1>
      <p id="tagline" class="tagline"></p>
    </div>
    <p class="builder">Last deployed by <strong id="workshopper">...</strong></p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">New claim</h2>
      <form id="claim-form" novalidate>
        <label for="employee">Employee name</label>
        <input id="employee" name="employee" autocomplete="name" required>

        <div class="row">
          <div>
            <label for="category">Category</label>
            <select id="category" name="category" required></select>
          </div>
          <div>
            <label for="amount">Amount (EUR)</label>
            <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required>
          </div>
        </div>

        <label for="description">What was it for?</label>
        <textarea id="description" name="description" rows="3" required></textarea>

        <ul id="errors" class="errors" role="alert" hidden></ul>
        <button type="submit">Submit claim</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <h2 id="list-title">Submitted claims</h2>
      <p id="empty" class="empty">No claims yet. Submit one using the form.</p>
      <table id="claims" hidden>
        <thead>
          <tr><th scope="col">#</th><th scope="col">Employee</th><th scope="col">Category</th><th scope="col" class="num">Amount</th><th scope="col">Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
